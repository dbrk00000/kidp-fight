name: KIDP 자동 업데이트

on:
  schedule:
    - cron: '0 2 * * 1-5'   # 오전 11시 KST (평일)
    - cron: '0 9 * * 1-5'   # 오후 6시 KST (평일)
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install anthropic requests beautifulsoup4

      - name: KIDP 크롤링 및 요약
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_and_summarize.py

      - name: 변경사항 커밋
        run: |
          git config user.name "KIDP Bot"
          git config user.email "bot@kidp-fight"
          git add data/updates.json
          git diff --staged --quiet || git commit -m "자동 업데이트: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')"
          git push
